syntax = "proto3";

package ua.gov.diia.types.ds.organisms;

import "designSystem/molecules/iconCardMlc.proto";
import "designSystem/molecules/miniCardMlc.proto";
import "ui.proto";

option java_multiple_files = true;
option java_package = "ua.gov.diia.types.ds.organisms";

/**
 * @see https://diia.atlassian.net/wiki/spaces/DIIA/pages/3197042693/cardCarouselScrollOrg
 */
message CardCarouselScrollOrg {
  string componentId = 1;
  optional ua.gov.diia.types.ds.PaddingMode paddingMode = 2;
  repeated CardCarouselScrollOrgItem items = 3;
}

message CardCarouselScrollOrgItem {
  optional ua.gov.diia.types.ds.molecules.MiniCardMlc miniCardMlc = 1;
  optional ua.gov.diia.types.ds.molecules.IconCardMlc iconCardMlc = 2;
}
