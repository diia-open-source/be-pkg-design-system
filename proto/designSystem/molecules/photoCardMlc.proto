syntax = "proto3";

package ua.gov.diia.types.ds.molecules;

import "designSystem/atoms/iconAtm.proto";
import "designSystem/molecules/checkboxMlc.proto";
import "designSystem/molecules/radioBtnElementMlc.proto";
import "ui.proto";

option java_multiple_files = true;
option java_package = "ua.gov.diia.types.ds.molecules";

/**
 * @see https://diia.atlassian.net/wiki/spaces/DIIA/pages/2287337473/photoCardMlc
 */
message PhotoCardMlc {
  string componentId = 1;
  string photo = 2;
  optional ua.gov.diia.types.ds.atoms.IconAtm iconRight = 3;
  optional ua.gov.diia.types.ds.molecules.CheckboxMlc checkboxMlc = 4;
  optional ua.gov.diia.types.ds.molecules.RadioBtnElementMlc radioBtnElementMlc = 5;
  optional ua.gov.diia.types.ds.Action action = 6;
}
