syntax = "proto3";

package ua.gov.diia.types.ds.atoms;

import "ui.proto";

option java_multiple_files = true;
option java_package = "ua.gov.diia.types.ds.atoms";

/**
 * @see https://diia.atlassian.net/wiki/spaces/DIIA/pages/3118891169/outlinedPicAtm
 */
message OutlinedPicAtm {
  string componentId = 1;
  optional ua.gov.diia.types.ds.PaddingMode paddingMode = 2;
  optional double aspectRatio = 3;
  optional string image = 4;
}
