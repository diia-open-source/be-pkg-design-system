syntax = "proto3";

package ua.gov.diia.types.ds.molecules;

import "designSystem/atoms/badgeCounterAtm.proto";
import "designSystem/atoms/buttonAction.proto";
import "designSystem/atoms/enums/buttonStateAtmType.proto";
import "designSystem/atoms/smallIconAtm.proto";

option java_multiple_files = true;
option java_package = "ua.gov.diia.types.ds.molecules";

/**
 @see https://diia.atlassian.net/wiki/spaces/DIIA/pages/1315602547/button#btnSortMlc
*/
message BtnSortMlc {
  string componentId = 1;
  optional string accessibilityDescription = 2;
  optional string label = 3;
  optional ua.gov.diia.types.ds.atoms.button.ButtonState state = 4;
  optional string icon = 5;
  optional ua.gov.diia.types.ds.atoms.BadgeCounterAtm badgeCounterAtm = 6;
  optional ua.gov.diia.types.ds.atoms.button.ButtonAction action = 7;
}
