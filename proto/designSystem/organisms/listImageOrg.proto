syntax = "proto3";

package ua.gov.diia.types.ds.organisms;

import "designSystem/atoms/buttonAction.proto";
import "designSystem/atoms/smallIconAtm.proto";
import "designSystem/atoms/squareChipStatusAtm.proto";
import "designSystem/molecules/listItemMlc.proto";
import "ui.proto";

option java_multiple_files = true;
option java_package = "ua.gov.diia.types.ds.organisms";

/**
 * @see https://diia.atlassian.net/wiki/spaces/DIIA/pages/3197075457/listImageOrg
 */
message ListImageOrg {
  string componentId = 1;
  optional ua.gov.diia.types.ds.PaddingMode paddingMode = 2;
  optional string image = 3;
  optional ua.gov.diia.types.ds.atoms.SquareChipStatusAtm squareChipStatusAtm = 4;
  optional string title = 5;
  optional string label = 6;
  optional string description = 7;
  optional ua.gov.diia.types.ds.atoms.SmallIconAtm iconRight = 8;
  repeated ListImageOrgItem items = 9;
  optional bool showDivider = 10;
  optional ua.gov.diia.types.ds.atoms.button.ButtonAction action = 11;
}

message ListImageOrgItem {
  optional ua.gov.diia.types.ds.molecules.ListItemMlc listItemMlc = 1;
}
