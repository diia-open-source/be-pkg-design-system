syntax = "proto3";

package ua.gov.diia.types.ds.molecules;

import "ui.proto";

option java_multiple_files = true;
option java_package = "ua.gov.diia.types.ds.molecules";

/**
 * @see https://diia.atlassian.net/wiki/spaces/DIIA/pages/3083796525/textCounterMlc
 */
message TextCounterMlc {
  string componentId = 1;
  optional ua.gov.diia.types.ds.PaddingMode paddingMode = 2;
  optional string text = 3;
  int32 value = 4;
  optional int32 limit = 5;
}
